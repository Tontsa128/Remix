name: Elovio web quality

on:
  push:
    branches: [main, "fix/**", "feat/**"]
    paths-ignore:
      - "apps/mobile/**"
      - "supabase/migrations/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elovio-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TanStack web · lint, tests, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: ESLint
        run: bun run lint
      - name: Unit and integration tests
        run: bun run test
      - name: TypeScript
        run: bun run typecheck
      - name: Production build
        run: bun run build
